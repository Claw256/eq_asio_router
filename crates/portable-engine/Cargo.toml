[package]
name = "portable-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eq-core.workspace = true
router-core = { path = "../router-core" }
thiserror.workspace = true

# Target-specific backend dependencies (A8/A4: hand-written #[link] FFI only —
# no -sys/wrapper crates, their build.rs probes pkg-config/system SDKs and would
# break the A7 cross-target `cargo check` gate from a non-target host).
# Left EMPTY in Phase A; B1/B2 fill these sections in Phase B if needed.
[target.'cfg(target_os = "linux")'.dependencies]
# B1 fills (Phase B) — expected to stay empty for raw ALSA/PipeWire FFI.

[target.'cfg(target_os = "macos")'.dependencies]
# B2 fills (Phase B) — expected to stay empty for raw Core Audio FFI.

[target.'cfg(target_os = "windows")'.dependencies]
# Phase C: the Windows OutputSink wraps the existing asio-host crate (registry + COM
# + IASIO wrapper); `windows` only names HWND in AsioDriver::load_diagnosed. The
# windows crate has no build.rs probes, so the A7 cross-target check gate holds.
asio-host.workspace = true
windows = { workspace = true, features = ["Win32_Foundation"] }

[features]
# Phase C (deviation D2): the three backend features are ON by default (each module
# is still cfg-gated per target OS, see src/backend/mod.rs), so the fixed, flag-free
# gates (`cargo build --workspace --all-targets`, `cargo check -p portable-engine
# --target …`) actually compile the backend for the target under test.
default = ["backend-linux", "backend-macos", "backend-windows"]
backend-linux = []
backend-macos = []
backend-windows = []
