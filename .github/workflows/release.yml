name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p eq-asio-app -p router-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/eq-asio-app.exe, target/release/router-cli.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "eq_asio_router-${{ github.ref_name }}-windows-x64.zip"
      - name: Extract release notes
        shell: bash
        run: |
          awk -v t="## ${{ github.ref_name }}" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > RELEASE_NOTES.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: eq_asio_router-*-windows-x64.zip
          body_path: RELEASE_NOTES.md
